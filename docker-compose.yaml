version: '3.8'

services:
  # Il server web (Nginx)
  web:
    image: nginx:alpine
    container_name: scadenze_web
    restart: unless-stopped
    ports:
      - "8000:80" # Sul tuo PC lo vedrai sulla porta 8000
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Scheduler per invio email notifiche scadenze
  scheduler:
    build:
      context: .
    volumes:
      - ./:/var/www
    command: php artisan schedule:work
    depends_on:
      - db

  # L'applicazione Laravel (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scadenze_app
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db

  # Il Database (MariaDB)
  db:
    image: mariadb:10.11
    container_name: scadenze_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-scadenze_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-scadenze_user}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

# Volume persistente per salvare il database anche se si spegne il container
volumes:
  db_data: